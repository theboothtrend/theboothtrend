<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>404 - Out of Frame | THE BOOTH TREND</title>
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary: #A259FF;
            --dark: #000000;
            --light: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            /* Subtle purple glow behind the content to match the brand */
            background-image: radial-gradient(circle at 50% 40%, rgba(162, 89, 255, 0.15) 0%, transparent 60%);
        }

        .error-container {
            padding: 40px 20px;
            max-width: 400px;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Glassmorphism Icon Container */
        .icon-wrapper {
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: var(--primary);
        }

        h1 {
            font-size: 84px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 8px 0 16px;
            letter-spacing: 0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Match the main app's highlight button style */
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border: none;
            padding: 16px 36px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(162, 89, 255, 0.3);
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .action-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(162, 89, 255, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="icon-wrapper">
            <!-- Camera-off icon fits the photo booth theme perfectly -->
            <i data-lucide="camera-off" style="width: 44px; height: 44px;"></i>
        </div>
        
        <h1>404</h1>
        <h2>Out of Frame</h2>
        <p>The page you are looking for seems to have stepped out of the shot. Let's get you back in focus.</p>
        
        <!-- Routes back to the main photo booth interface -->
        <a href="index.html" class="action-btn">
            <i data-lucide="home" style="width: 20px; height: 20px;"></i>
            Back to Booth
        </a>
    </div>

    <script>
        // Initialize the Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
