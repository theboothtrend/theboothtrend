<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRISTINATINA - All Customers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --magenta-dark: #2a0416;
            --magenta-rich: #520930;
            --gold-light: #fcf6ba;
            --gold-main: #d4af37;
            --gold-dark: #b38728;
            --text-light: #fdf5e6;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, var(--magenta-dark) 0%, var(--magenta-rich) 50%, var(--magenta-dark) 100%); 
            color: var(--text-light);
            padding: 40px 20px; 
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .admin-panel { 
            width: 100%;
            max-width: 800px; 
            background: rgba(20, 2, 10, 0.6); 
            backdrop-filter: blur(10px);
            padding: 30px; 
            border-radius: 20px; 
            border: 2px solid var(--gold-main); 
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2); 
            box-sizing: border-box;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-light);
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .back-btn { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            background: transparent; 
            color: var(--gold-main); 
            border: 1px solid var(--gold-main);
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold-light);
        }

        /* Elegant Table Styling */
        .table-container {
            overflow-x: auto;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }

        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); 
        }

        th { 
            font-family: 'Playfair Display', serif;
            color: var(--gold-main); 
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        td {
            font-size: 15px;
            color: #ebd4e0;
        }

        tr {
            transition: background 0.3s;
        }

        tr:hover { 
            background-color: rgba(212, 175, 55, 0.1); 
        }

        td strong {
            color: var(--gold-light);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="admin-panel">
        <a href="admin.html" class="back-btn">← Back to Staff Portal</a>
        <h2>Customer Database</h2>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Mobile Number</th>
                        <th>Total Visits</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody">
                    <tr><td colspan="3" style="text-align:center;">Loading database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // CRITICAL: Replace with your actual PHP backend URL
        const API_URL = "https://enzoytours.co.nz/myapi/admin.php";

        async function loadCustomers() {
            try {
                const res = await fetch(API_URL, {
                    method: "POST", 
                    body: JSON.stringify({ action: "list_all" })
                });
                const data = await res.json();
                
                const tbody = document.getElementById("customerTableBody");
                tbody.innerHTML = ""; 

                if (data.status === "success" && data.data.length > 0) {
                    data.data.forEach(customer => {
                        let row = `<tr>
                            <td>${customer.name}</td>
                            <td>${customer.mobile}</td>
                            <td><strong>${customer.visits}</strong></td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No customers found.</td></tr>`;
                }
            } catch (error) {
                document.getElementById("customerTableBody").innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ff6b6b;">Error loading data. Check connection.</td></tr>`;
            }
        }

        loadCustomers();
    </script>
</body>
</html>
